<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ASCII 鲨鱼背景 · C 方案（程序化闭合路径）</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;overflow:hidden;background:#fff;
       font-family:-apple-system,"Helvetica Neue","PingFang SC",sans-serif}
  #bg{position:fixed;inset:0;width:100%;height:100%;display:block;background:#fff}
  #tag{position:fixed;left:18px;bottom:16px;font-size:11.5px;color:#6f6a80;letter-spacing:.02em;
       background:rgba(255,255,255,.82);border:1px solid #eceaf3;border-radius:8px;padding:5px 10px;
       backdrop-filter:blur(6px)}
  #tag b{color:#4b3fa8;font-weight:600}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="tag"><b>C 方案</b> · 程序化闭合路径 · 鱼身连续</div>

<script>
(() => {
  const COLS = 128, ROWS = 72;
  const PERIOD = 22;            // 一圈用时（秒）
  const cv = document.getElementById('bg');
  const ctx = cv.getContext('2d');
  const CHARS = 'abcdefghijkmnabcdefghijklmnopqrstuvwxyz0123456789+-*/<>[]{}()#%&@$~=:'.split('');
  const hash = (x, y, k) => { let h = (x * 73856093) ^ (y * 19349663) ^ (k * 83492791); h = (h ^ (h >>> 13)) >>> 0; return h; };

  let W = 0, H = 0, cw = 16, ch = 10, dpr = 1, fontPx = 10;
  let frozen = null;            // 截图用：固定时间

  function resize(){
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cw = W / COLS; ch = H / ROWS;
    fontPx = Math.max(6, Math.min(14, Math.min(cw, ch) * 1.0));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = fontPx.toFixed(1) + 'px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  }

  /* ---------- 闭合游动路径 ---------- */
  function pathAt(a){
    const cx = COLS * 0.5 + Math.sin(a * 2) * COLS * 0.035;
    const cy = ROWS * 0.5 + Math.sin(a * 3 + 1.1) * ROWS * 0.05;
    const rx = COLS * 0.30 + Math.sin(a * 2 + 0.7) * COLS * 0.03;
    const ry = ROWS * 0.22 + Math.cos(a * 2 + 0.4) * ROWS * 0.03;
    const x = cx + Math.cos(a) * rx;
    const y = cy + Math.sin(a) * ry;
    const e = 0.001, b = a + e;
    const cx2 = COLS * 0.5 + Math.sin(b * 2) * COLS * 0.035;
    const cy2 = ROWS * 0.5 + Math.sin(b * 3 + 1.1) * ROWS * 0.05;
    const rx2 = COLS * 0.30 + Math.sin(b * 2 + 0.7) * COLS * 0.03;
    const ry2 = ROWS * 0.22 + Math.cos(b * 2 + 0.4) * ROWS * 0.03;
    const x2 = cx2 + Math.cos(b) * rx2;
    const y2 = cy2 + Math.sin(b) * ry2;
    return { x, y, ang: Math.atan2(y2 - y, x2 - x) };
  }

  /* ---------- 鲨鱼形状（局部坐标，u=-0.5 鼻尖 → u=0.46 尾柄） ---------- */
  const LEN = COLS * 0.30;
  const WID = 0.128;

  function halfWidth(u){
    if (u < -0.54 || u > 0.56) return 0;
    // 吻端圆钝一点，最粗在身体前 1/3，往尾柄收细
    const s = (u + 0.54) / 1.10;
    const base = Math.pow(Math.sin(Math.PI * Math.min(1, s)), 0.55);
    const taper = 1 - 0.42 * s * s;
    return WID * base * taper;
  }
  function inTailFin(u, v){
    const uu = u - 0.50;
    if (uu < 0 || uu > 0.30) return false;
    const t = uu / 0.30;
    const up = 0.16 * Math.sin(t * Math.PI * 0.62) + 0.006;
    const dn = 0.11 * Math.sin(t * Math.PI * 0.78) + 0.004;
    // 尾鳍分叉：从 40% 处往后，中线留出缺口
    if (t > 0.42 && Math.abs(v) < 0.022 * (t - 0.42) / 0.58 + 0.004) return false;
    return (v < 0 && v > -up) || (v > 0 && v < dn);
  }
  function inDorsal(u, v){
    if (u < -0.20 || u > 0.12) return false;
    const t = (u + 0.20) / 0.32;
    const h = 0.075 * Math.sin(t * Math.PI);
    return v < -WID * 0.9 && v > -WID * 0.9 - h;
  }
  function inPectoral(u, v){
    if (u < -0.20 || u > 0.10) return false;
    const t = (u + 0.20) / 0.30;
    const h = 0.075 * Math.sin(t * Math.PI);
    return v > WID * 0.6 && v < WID * 0.6 + h;
  }
  function silhouette(u, v){
    const hw = halfWidth(u);
    if (hw > 0){
      const d = hw - Math.abs(v);
      if (d > 0) return d / hw;   // 0..1，中心最实
    }
    if (inTailFin(u, v)) return 0.35;
    if (inDorsal(u, v)) return 0.4;
    if (inPectoral(u, v)) return 0.38;
    return -1;
  }

  /* ---------- 绘制 ---------- */
  function draw(now){
    const t = frozen != null ? frozen : (now / 1000);
    const a = (t / PERIOD) * Math.PI * 2;
    const p = pathAt(a);
    const ca = Math.cos(p.ang), sa = Math.sin(p.ang);

    ctx.clearRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(120,110,150,.09)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= COLS; x++){ const px = Math.round(x * cw) + .5; ctx.moveTo(px, 0); ctx.lineTo(px, H); }
    for (let y = 0; y <= ROWS; y++){ const py = Math.round(y * ch) + .5; ctx.moveTo(0, py); ctx.lineTo(W, py); }
    ctx.stroke();

    ctx.font = fontPx.toFixed(1) + 'px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    const phase = t * 3.4;

    for (let gy = 0; gy < ROWS; gy++){
      for (let gx = 0; gx < COLS; gx++){
        const dx = gx + 0.5 - p.x, dy = gy + 0.5 - p.y;
        const u = (dx * ca + dy * sa) / LEN;
        const v0 = (-dx * sa + dy * ca) / LEN;
        // 身体行波：越靠尾摆幅越大
        const und = 0.05 * Math.max(0, u + 0.2) * Math.sin(u * 7.5 - phase);
        const dens = silhouette(u, v0 - und);
        if (dens < 0) continue;

        // 内部流动的明暗，让整条鱼均匀连续地“流”
        const flow = 0.80 + 0.20 * Math.sin(u * 9.0 - phase * 1.15 + v0 * 4.0);
        const d = Math.min(1, (0.55 + 0.45 * dens) * flow);

        const bx = gx * cw + cw * 0.07, by = gy * ch + ch * 0.07;
        const bw = cw * 0.86, bh = ch * 0.86;
        ctx.globalAlpha = Math.min(0.72, 0.12 + d * 0.62);
        ctx.fillStyle = '#8b82a8';
        ctx.fillRect(bx, by, bw, bh);
        ctx.globalAlpha = Math.min(0.3, 0.03 + d * 0.24);
        ctx.strokeStyle = '#6d6488';
        ctx.lineWidth = 0.7;
        ctx.strokeRect(bx + 0.35, by + 0.35, bw - 0.7, bh - 0.7);

        ctx.globalAlpha = Math.min(0.95, 0.2 + d * 0.7);
        ctx.fillStyle = '#2f2845';
        const chIdx = hash(gx, gy, Math.floor(t * 6)) % CHARS.length;
        ctx.fillText(CHARS[chIdx], gx * cw + cw / 2, gy * ch + ch / 2 + (hash(gx, gy, 3) % 3 - 1) * 0.5);
      }
    }
    ctx.globalAlpha = 1;
  }

  // 调试：只看轮廓（实心灰块），不带字符
  function drawShape(t){
    const a = (t / PERIOD) * Math.PI * 2;
    const p = pathAt(a);
    const ca = Math.cos(p.ang), sa = Math.sin(p.ang);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#777';
    const phase = t * 3.4;
    for (let gy = 0; gy < ROWS; gy++){
      for (let gx = 0; gx < COLS; gx++){
        const dx = gx + 0.5 - p.x, dy = gy + 0.5 - p.y;
        const u = (dx * ca + dy * sa) / LEN;
        const v0 = (-dx * sa + dy * ca) / LEN;
        const und = 0.07 * Math.max(0, u + 0.2) * Math.sin(u * 7.5 - phase);
        const dens = silhouette(u, v0 - und);
        if (dens < 0) continue;
        ctx.globalAlpha = 1;
        ctx.fillRect(gx * cw + 1, gy * ch + 1, cw - 2, ch - 2);
      }
    }
    ctx.globalAlpha = 1;
  }

  function loop(now){ requestAnimationFrame(loop); if (!location.search.includes('shape')) draw(now); }

  window.__freeze = (sec) => { frozen = sec; if (location.search.includes('shape')) drawShape(sec); else draw(sec * 1000); };
  window.__resume = () => { frozen = null; };
  window.__stats = () => ({ frozen, cols: COLS, rows: ROWS, period: PERIOD });

  addEventListener('resize', () => { resize(); draw(performance.now()); });
  resize();
  requestAnimationFrame(loop);
  window.__ready = true;
})();
</script>
</body>
</html>
